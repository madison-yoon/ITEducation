name: Build Check

on:
  push:
    branches: [main, "fix/**", "feature/**", "quality/**"]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Test navigation and page metadata
        run: npm test

  browser:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Build GitHub Pages preview
        env:
          GITHUB_PAGES: "true"
          VITE_STATIC_PREVIEW: "true"
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public-site browser regression tests
        run: npx playwright test --config=playwright.config.js
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-academy-browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test and build backend
        run: gradle clean build --no-daemon

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build frontend and backend images
        run: docker compose build
