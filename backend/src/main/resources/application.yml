server:
  port: 8080
  servlet:
    session:
      timeout: 30m
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/it_academy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul